limit_req_zone $binary_remote_addr zone=game_api:10m rate=5r/s;

upstream pocketbase_backend { server pocketbase:8090; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health { access_log off; return 200 'ok'; }
    location = /voice { try_files /voice.html =404; }
    location = /api/leaderboard { rewrite ^ /api/finni/leaderboard last; }
    location = /api/runs { rewrite ^ /api/finni/runs last; }
    location = /api/scores { rewrite ^ /api/finni/scores last; }
    location /api/finni/ {
        limit_req zone=game_api burst=15 nodelay;
        client_max_body_size 4k;
        proxy_pass http://pocketbase_backend;
        proxy_set_header Host $host;
        # Never trust a client-supplied forwarded address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # PocketBase's dashboard, account setup, backup APIs, and realtime updates.
    # Record create/update/delete rules remain superuser-only.
    location /_/ { proxy_pass http://pocketbase_backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/ { proxy_pass http://pocketbase_backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_buffering off; proxy_read_timeout 3600s; }
    location /engine/ { try_files $uri =404; expires 7d; }
    location = /table.vpx { alias /usr/share/nginx/html/runtime/Finni-Big-Day.vpx; expires 1h; }
    location = /dmd-atlas.png { alias /usr/share/nginx/html/runtime/dmd-atlas.png; expires 1h; }
    location = /dmd-atlas.json { alias /usr/share/nginx/html/runtime/dmd-atlas.json; expires 1h; }
    location = /dmd-animations.json { alias /usr/share/nginx/html/runtime/dmd-animations.json; expires 1h; }
    location /runtime/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
