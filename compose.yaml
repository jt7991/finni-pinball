# Select this file in a Git-based Coolify Docker Compose application.
# Assign an HTTPS domain to game on internal port 80; no host ports are needed.
services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      pocketbase:
        condition: service_healthy

  pocketbase:
    build:
      context: .
      dockerfile: pocketbase/Dockerfile
    restart: unless-stopped
    volumes:
      # Includes SQLite, settings, backups, and storage/ with both WAV versions.
      # Keep files and database together; do not mount a second volume over storage/.
      - pocketbase_data:/pb/pb_data
    # Access /_/ and /api/ through game; do not assign a public domain here.

volumes:
  # Coolify scopes these names to the resource and reuses them on redeploy.
  pocketbase_data:
